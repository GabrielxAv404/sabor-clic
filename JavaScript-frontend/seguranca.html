
<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Segurança - Sushi Zen</title>
    <link rel="stylesheet" href="./css/seguranca.css">
</head>

<body>

    <main class="pag-SegurancaForm">

        <header class="cabecalho">
            <img src="./imagens/logo projeto.png" alt="Logo" class="logo">

            <h1>SUSHI ZEN</h1>

            <p class="subtitulo">ENTREGA • EVENTOS • EXPERIÊNCIAS</p>
        </header>

        <section class="container">

            <header class="titulo-SegurancaForm">
                <h2>Definição de Senha</h2>
            </header>

            <form action="" method="post" id="SegurancaForm">

                <label for="nome">Nova Senha</label>
                <input type="password" name="nova_senha" id="nova_senha" placeholder="Digite a nova senha" required>

                <label for="area_atuacao">Confirmar Senha</label>
                <input type="password" name="confirmar_nova_senha" id="confirmar_nova_senha" placeholder="Confirme a nova senha" required>

                <button type="submit">Atualizar Senha</button>

                <div id="mensagem_erro"></div>

            </form>

        </section>

    </main>

</body>
</html>
