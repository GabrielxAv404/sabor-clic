
<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cadastrar Prato - Sushi Zen</title>
    <link rel="stylesheet" href="../css/arquivos_admin_css/cadastrar_prato.css">
</head>

<body>

 <main class="pag-cadastroPrato">

    <header class="cabecalho">
        <img src="../imagens/logo projeto.png" alt="Logo" class="logo">

        <h1>SUSHI ZEN</h1>

        <p class="subtitulo">ENTREGA • EVENTOS • EXPERIÊNCIAS</p>
    </header>

    <section class="container">

        <header class="titulo-cadastroPrato">
            <h2>Cadastre um novo prato!</h2>
        </header>

        <form id="formulario_administrador">

            <label for="nome_prato">Nome do prato</label>
            <input type="text" name="nome" id="nome_prato" placeholder="Digite o nome do prato" required>

            <label for="descricao_prato">Descrição</label>
            <input type="text" name="descricao" id="descricao_prato" placeholder="Digite a descrição do prato" required>

            <label for="preco_prato">Preço</label>
            <input type="number" step="0.01" name="preco" id="preco_prato" placeholder="Digite o preço do prato" required>

            <button type="submit">Cadastrar Prato</button>

            <div id="mensagem_erro"></div>

        </form>

        <div class="voltar" style="text-align: center; margin-top: 20px;">
            <a href="../admin.html" style="color: #a87920; text-decoration: none; font-weight: bold;">Voltar ao painel administrativo</a>
        </div>

    </section>

</main>
<script type="module" src="../js/main.js"></script>

</body>
</html>
