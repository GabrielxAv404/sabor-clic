<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cardapio </title>

    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 0;
            padding: 0;
            background-color: #f4f4f4;
        }

        .container {
            max-width: 800px;
            padding: 10px;
            text-align: center;
            margin: 0 auto;
            background-color: #fff;
            box-shadow: 0 0 10px rgba(0, 0, 0, 0.1);
        }

        nav {
            display: flex;
            gap: 20px;
            padding: 15px;
            background-color: blue;
        }

        nav a {
            color: white;
            text-decoration: none;
        }
    </style>

</head>

<body>
    <div class="container">
        <header>
            <h1>Restaurante Sabor & Click</h1>
            <nav>
                <a href="index.html">Cardápio</a>
                <a href="admin.html">Admin</a>
                <a href="kds.html">Cozinha</a>
            </nav>
        </header>
        <h2>Cardápio</h2>

        <div id="Cardapio"></div>
        <div class="sub-container">

            <h2> Preço do pedido</h2>
            <div id="carrinho">

                <p>Total: R$ <span id="valor_total">0,00</span></p>

            </div>
            <div class="formulario">

                <form id="formulario_pedido">

                    <label for="nome_usuario">Nome</label>
                    <input type="text" name="nome_usuario" id="nome_usuario" placeholder="EX: Gabriel" required>

                    <hr>
                    <h2> Item pedido</h2>
                    <label for="nome_comida">Nome do Prato</label>
                    <input type="text" name="nome_comida" id="nome_comida" placeholder="EX: Hot Dog" required readonly>

                    <label for="quantidade">Quantidade</label>
                    <input type="number" name="quantidade" id="quantidade" min="1" value="1" placeholder="EX: 2" required>

                    <hr>

                    <button type="submit">Enviar Pedido</button>
                </form>
            </div>
        </div>
    </div>
    <script src="js/main.js"></script>

</body>

</html>
