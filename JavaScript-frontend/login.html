
<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - Sushi Zen</title>
    <link rel="stylesheet" href="css/login.css">
</head>

<body>

    <main class="pag-login">

        <header class="cabecalho">
            <img src="../imagens/logo projeto.png" alt="Logo" class="logo">

            <h1>SUSHI ZEN</h1>

            <p class="subtitulo">ENTREGA • EVENTOS • EXPERIÊNCIAS</p>
        </header>

        <section class="container">

            <header class="titulo-login">
                <h2>Bem-vindo ao SZ!</h2>
                <h3>Já possui conta? Entre agora!</h3>
            </header>

            <form action="" method="post" id="LoginForm">

                <label for="username">Usuário</label>
                <input type="text" name="username" id="username" placeholder="Digite seu nome de usuário" required>

                <label for="password">Senha</label>
                <input type="password" name="password" id="password" placeholder="Digite sua senha" required>

                <button type="submit">ENTRAR</button>

                <div id="mensagem_erro"></div>

                <div class="cadastro">
                    <p>Ainda não possui uma conta?</p>
                    <a href="cadastro.html">Cadastre-se</a>
                </div>

            </form>

        </section>

    </main>

</body>
</html>
