<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Painel da Cozinha (KDS) | Sabor & Clic</title>
  <link rel="stylesheet" href="css/painelCozinha.css">
</head>
<body>
 
  <header class="topo">
    <div class="marca">
      <img class="logo" src="../imagens/logo projeto.png" alt="Logo Sabor & Clic">
      <span class="nome-marca">SABOR & CLIC</span>
    </div>
    <h1>PAINEL DE PEDIDOS (KDS)</h1>
    <div class="topo-info">
      <p class="online">Cozinha Conectada</p>
    </div>
  </header>

  <!-- Seção de Agendamento de Bancadas na Dark Kitchen -->
  <section class="agendamento-container" style="padding: 15px; background: #f4f4f4; margin: 10px;">
    <h2>Agendamento de Bancada</h2>
    <form id="formulario_agendamento">
        <label for="select_bancada">Bancada:</label>
        <select id="select_bancada" required>
            <option value="">Carregando bancadas...</option>
        </select>

        <label for="data_agendamento">Data:</label>
        <input type="date" id="data_agendamento" required>

        <label for="hora_inicio">Hora Início:</label>
        <input type="time" id="hora_inicio" required>

        <label for="hora_fim">Hora Fim:</label>
        <input type="time" id="hora_fim" required>

        <button type="submit">Agendar Bancada</button>
    </form>
  </section>

  <!-- Container onde os cards de pedidos são renderizados pelo main.js -->
  <main class="lista" id="painel_cozinheiro">
      <!-- Preenchido via carregarKDS() -->
  </main>

  <nav class="menu-inferior">
    <a href="index.html" class="item-menu"><span>⌂</span><p>Início</p></a>
    <a href="pedidos_cliente.html" class="item-menu"><span>⌕</span><p>Rastreio</p></a>
    <a href="painelCozinha.html" class="item-menu ativo"><span>▤</span><p>Cozinha</p></a>
    <a href="admin.html" class="item-menu"><span>⚙</span><p>Admin</p></a>
    <a href="login.html" class="item-menu"><span>⇥</span><p>Sair</p></a>
  </nav>

  <script type="module" src="js/main.js"></script>
</body>
</html>
