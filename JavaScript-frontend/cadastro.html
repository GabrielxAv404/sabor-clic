<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cadastro - Sabor & Clic</title>
    <link rel="stylesheet" href="./css/cadastro.css">
</head>

<body>

    <main class="pag-cadastro">

        <header class="cabecalho">
            <img src="../imagens/logo projeto.png" alt="Logo" class="logo">
            <h1>SABOR & CLIC</h1>
            <p class="subtitulo">ENTREGA • EVENTOS • EXPERIÊNCIAS</p>
        </header>

        <section class="container">

            <header class="titulo-cadastro">
                <h2>Bem-vindo ao Sabor & Clic!</h2>
                <h3>Crie a sua conta!</h3>
            </header>

            <form action="" method="post" id="CadastroForm">

                <label for="email">E-mail</label>
                <input type="email" name="email" id="email" placeholder="Digite seu e-mail" required>

                <label for="username">Nome de Usuário</label>
                <input type="text" name="username" id="username" placeholder="Digite seu nome de usuário" required>

                <label for="telefone">Telefone de Contato</label>
                <label for="telefone">Telefone de Contato</label>
                <input type="tel" name="telefone" id="telefone" placeholder="Digite com DDD (11 dígitos)" maxlength="11" required>

                <label for="endereco">Endereço Completo</label>
                <input type="text" name="endereco" id="endereco" placeholder="Rua, Número, Bairro, Cidade" required>

                <label for="password">Senha</label>
                <input type="password" name="password" id="password" placeholder="Digite sua senha" required>

                <label for="confirm_password">Confirmar Senha</label>
                <input type="password" name="confirm_password" id="confirm_password" placeholder="Confirme sua senha"
                    required>

                <button type="submit">CADASTRAR</button>

                <div id="mensagem_erro"></div>

                <div class="cadastro">
                    <p>Já possui conta?</p>
                    <a href="login.html">Entre agora</a>
                </div>

            </form>

        </section>

    </main>

    <script type="module" src="js/main.js"></script>
</body>

</html>
