
<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Editar Endereço - Sushi Zen</title>
    <link rel="stylesheet" href="./css/endereco.css">
</head>

<body>

    <main class="pag-EnderecoForm">

        <header class="cabecalho">
            <img src="./imagens/logo projeto.png" alt="Logo" class="logo">

            <h1>SUSHI ZEN</h1>

            <p class="subtitulo">ENTREGA • EVENTOS • EXPERIÊNCIAS</p>
        </header>

        <section class="container">

            <header class="titulo-EnderecoForm">
                <h2>Edite seu Endereço</h2>
            </header>

            <form action="" method="post" id="CadEnderecoForm">

                <label for="cidade">Cidade</label>
                <input type="text" name="cidade" id="cidade" placeholder="Digite a cidade" required>

                <label for="cep">CEP</label>
                <input type="text" name="cep" id="cep" placeholder="Digite o CEP" required>

                <label for="bairro">Bairro</label>
                <input type="text" name="bairro" id="bairro" placeholder="Digite o bairro" required>

                <label for="rua">Rua</label>
                <input type="text" name="rua" id="rua" placeholder="Digite a rua" required>
                
                <label for="numero">Número</label>
                <input type="text" name="numero" id="numero" placeholder="Digite o número da residência" required>

                <button type="submit">Alterar Endereço</button>

                <div id="mensagem_erro"></div>

            </form>

        </section>

    </main>
    <script type="module" src="js/main.js"></script>

</body>
</html>
